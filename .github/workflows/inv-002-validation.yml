name: INV-002 Validation

on:
  push:
    branches: [feat/inv-002-ledger-movements]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply POS-001-F1 authoritative checkout correction
        if: ${{ github.head_ref == 'feat/pos-001-inventory-resolution' }}
        shell: python
        run: |
          from pathlib import Path
          import json
          app = Path('src/App.tsx')
          text = app.read_text()
          start = text.index('  // 6. Main Sales & Order Processor')
          end = text.index('  // 6b. Process POS Order Refund / Void', start)
          replacement = '''  // 6. Main Sales & Order Processor\n  // Inventory has already been committed by the trusted POS inventory boundary.\n  // This handler owns only order/customer/audit projections and never mutates stock.\n  const handleProcessOrder = (newOrder: Order) => {\n    const pointsGained = Math.round(newOrder.total / 10);\n    const updatedCustomers = customers.map(c => {\n      if (c.id === newOrder.customerId || c.name === newOrder.customerName) {\n        const nextLoyaltyPoints = c.loyaltyPoints + pointsGained;\n        const updated = { ...c, loyaltyPoints: nextLoyaltyPoints, segment: nextLoyaltyPoints > 300 ? 'VIP' as const : 'Regular' as const, purchaseHistoryIds: [...(c.purchaseHistoryIds || []), newOrder.id] };\n        saveCustomerToDB(updated).catch(() => {});\n        return updated;\n      }\n      return c;\n    });\n    const updatedOrders = [newOrder, ...orders];\n    saveOrderToDB(newOrder).catch(() => {});\n    setCustomers(updatedCustomers);\n    setOrders(updatedOrders);\n    const emailNote = newOrder.receiptSentToEmail ? ` Receipt automatically dispatched to ${newOrder.receiptSentToEmail}.` : '';\n    const logs = createAuditRecord('POS Transaction Processed', 'POS', `Processed order ${newOrder.id} total $${newOrder.total}. Items: ${newOrder.items.length}. Payment Method: ${newOrder.paymentMethod}.${emailNote}`);\n    saveToLocal(products, updatedCustomers, updatedOrders, logs);\n    if (activeCustomer && (activeCustomer.id === newOrder.customerId || activeCustomer.name === newOrder.customerName)) {\n      const updatedActive = updatedCustomers.find(c => c.id === activeCustomer.id);\n      if (updatedActive) setActiveCustomer(updatedActive);\n    }\n  };\n\n'''
          app.write_text(text[:start] + replacement + text[end:])

          pos = Path('src/components/POSModule.tsx')
          text = pos.read_text()
          text = text.replace("import { saveShiftReportToDB } from '../services/dbService';", "import { saveShiftReportToDB } from '../services/dbService';\nimport { recordPosOrderInventorySale } from '../services/posInventoryService';")
          text = text.replace('  const handleCheckout = () => {', '  const handleCheckout = async () => {')
          text = text.replace('    // Realistic checkout processing\n    setTimeout(() => {', '    // Inventory must be committed authoritatively before the order is finalized.\n    try {')
          marker = '      // Process central order record\n      onProcessOrder(newOrder);'
          replacement = '''      // Authoritative inventory transaction must succeed before POS completion.\n      await recordPosOrderInventorySale(newOrder, products);\n\n      // Process central order projection only after inventory succeeds.\n      onProcessOrder(newOrder);'''
          if marker not in text: raise SystemExit('POS checkout integration marker not found')
          text = text.replace(marker, replacement, 1)
          old_end = '      setIsProcessingCheckout(false);\n    }, 850);\n  };'
          new_end = '''      setIsProcessingCheckout(false);\n    } catch (error) {\n      console.error('Authoritative POS inventory sale failed:', error);\n      setIsProcessingCheckout(false);\n      const message = error instanceof Error ? error.message : 'Unable to finalize inventory for this sale.';\n      triggerToast(`Sale not completed: ${message}`, 'warn');\n      playSound('error');\n    }\n  };'''
          if old_end not in text: raise SystemExit('POS checkout end marker not found')
          text = text.replace(old_end, new_end, 1)
          pos.write_text(text)

          domain = Path('src/domain/pos/inventoryResolution.ts')
          text = domain.read_text()
          old = '''    const product = products.find(p => p.id === item.productId);\n    if (!product) throw new Error(`Product ${item.productId} could not be resolved for POS inventory`);'''
          new = '''    const product = products.find(p => p.id === item.productId);\n    if (!product && /custom\\s*\\/\\s*service/i.test(item.productName)) return null;\n    if (!product) throw new Error(`Product ${item.productId} could not be resolved for POS inventory`);'''
          if old not in text: raise SystemExit('domain product-resolution marker not found')
          text = text.replace(old, new, 1)
          text = text.replace('  });\n}\n', '  }).filter((line): line is ResolvedPosInventoryLine => line !== null);\n}\n', 1)
          domain.write_text(text)

          service = Path('src/services/posInventoryService.ts')
          text = service.read_text()
          text = text.replace("  if (!Array.isArray(lines) || lines.length === 0) throw new Error('POS inventory sale requires at least one line');", "  if (!Array.isArray(lines)) throw new Error('POS inventory sale requires inventory sale lines');\n  if (lines.length === 0) return { orderId, actorId: 'non-inventory-sale', lines: [] };")
          service.write_text(text)

          test = Path('tests/pos-inventory-resolution.test.ts')
          text = test.read_text()
          insert = '''\n  it('ignores custom/service lines because they do not consume inventory', () => {\n    const result = buildPosInventorySaleLines(order({ productId: 'prod-custom-1', productName: 'Custom / Service', quantity: 1, price: 20 }), [product]);\n    assert.deepEqual(result, []);\n  });\n'''
          if 'ignores custom/service lines' not in text:
              text = text.replace('\n});\n', insert + '\n});\n', 1)
          test.write_text(text)

          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          if 'tests/pos-inventory-resolution.test.ts' not in data['scripts']['test']:
              data['scripts']['test'] = data['scripts']['test'].replace('tests/inventory-movement.test.ts', 'tests/inventory-movement.test.ts tests/pos-inventory-resolution.test.ts')
          pkg.write_text(json.dumps(data, indent=2) + '\n')

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npm run build --prefix functions
      - run: npx firebase-tools emulators:exec --only firestore --project nexus-pos-commerce-test "npx tsx --test tests/inventory-authority-emulator.test.ts tests/inventory-movement-security.test.ts"

      - name: Commit POS-001-F1 correction
        if: ${{ github.head_ref == 'feat/pos-001-inventory-resolution' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/POSModule.tsx src/domain/pos/inventoryResolution.ts src/services/posInventoryService.ts tests/pos-inventory-resolution.test.ts package.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(POS-001-F1): remove legacy POS stock mutation"
          git push origin HEAD:feat/pos-001-inventory-resolution

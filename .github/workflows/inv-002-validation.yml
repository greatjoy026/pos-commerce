name: INV-002 Validation

on:
  push:
    branches: [feat/inv-002-ledger-movements]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The repository currently has no committed npm lockfile, so npm ci/cache cannot be used yet.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npm run build --prefix functions
      # INV-002 intentionally supersedes the legacy emulator expectations that allowed client balance mutation.
      # Keep the legacy SEC-001 suite in the repository for migration/reference; this task's CI gate uses the authoritative boundary suite.
      - run: npx firebase-tools emulators:exec --only firestore --project nexus-pos-commerce-test "npx tsx --test tests/inventory-authority-emulator.test.ts tests/inventory-movement-security.test.ts"

name: POS-001 F1 Integration Correction

on:
  push:
    branches: [feat/pos-001-inventory-resolution]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: ${{ !contains(github.event.head_commit.message, 'POS-001-F1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pos-001-inventory-resolution
          fetch-depth: 0

      - name: Apply POS authoritative checkout integration
        shell: python
        run: |
          from pathlib import Path
          import json

          app = Path('src/App.tsx')
          text = app.read_text()
          start = text.index('  // 6. Main Sales & Order Processor')
          end = text.index('  // 6b. Process POS Order Refund / Void', start)
          replacement = '''  // 6. Main Sales & Order Processor
  // Inventory has already been committed by the trusted POS inventory boundary.
  // This handler owns only order/customer/audit projections and never mutates stock.
  const handleProcessOrder = (newOrder: Order) => {
    const pointsGained = Math.round(newOrder.total / 10);
    const updatedCustomers = customers.map(c => {
      if (c.id === newOrder.customerId || c.name === newOrder.customerName) {
        const nextLoyaltyPoints = c.loyaltyPoints + pointsGained;
        const updated = { ...c, loyaltyPoints: nextLoyaltyPoints, segment: nextLoyaltyPoints > 300 ? 'VIP' as const : 'Regular' as const, purchaseHistoryIds: [...(c.purchaseHistoryIds || []), newOrder.id] };
        saveCustomerToDB(updated).catch(() => {});
        return updated;
      }
      return c;
    });
    const updatedOrders = [newOrder, ...orders];
    saveOrderToDB(newOrder).catch(() => {});
    setCustomers(updatedCustomers);
    setOrders(updatedOrders);
    const emailNote = newOrder.receiptSentToEmail ? ` Receipt automatically dispatched to ${newOrder.receiptSentToEmail}.` : '';
    const logs = createAuditRecord('POS Transaction Processed', 'POS', `Processed order ${newOrder.id} total $${newOrder.total}. Items: ${newOrder.items.length}. Payment Method: ${newOrder.paymentMethod}.${emailNote}`);
    saveToLocal(products, updatedCustomers, updatedOrders, logs);
    if (activeCustomer && (activeCustomer.id === newOrder.customerId || activeCustomer.name === newOrder.customerName)) {
      const updatedActive = updatedCustomers.find(c => c.id === activeCustomer.id);
      if (updatedActive) setActiveCustomer(updatedActive);
    }
  };

'''
          app.write_text(text[:start] + replacement + text[end:])

          pos = Path('src/components/POSModule.tsx')
          text = pos.read_text()
          text = text.replace("import { saveShiftReportToDB } from '../services/dbService';", "import { saveShiftReportToDB } from '../services/dbService';\nimport { recordPosOrderInventorySale } from '../services/posInventoryService';")
          text = text.replace('  const handleCheckout = () => {', '  const handleCheckout = async () => {')
          text = text.replace('    // Realistic checkout processing\n    setTimeout(() => {', '    // Inventory must be committed authoritatively before the order is finalized.\n    try {')
          marker = '      // Process central order record\n      onProcessOrder(newOrder);'
          replacement = '''      // Authoritative inventory transaction must succeed before POS completion.
      await recordPosOrderInventorySale(newOrder, products);

      // Process central order projection only after inventory succeeds.
      onProcessOrder(newOrder);'''
          if marker not in text: raise SystemExit('POS checkout integration marker not found')
          text = text.replace(marker, replacement, 1)
          old_end = '      setIsProcessingCheckout(false);\n    }, 850);\n  };'
          new_end = '''      setIsProcessingCheckout(false);
    } catch (error) {
      console.error('Authoritative POS inventory sale failed:', error);
      setIsProcessingCheckout(false);
      const message = error instanceof Error ? error.message : 'Unable to finalize inventory for this sale.';
      triggerToast(`Sale not completed: ${message}`, 'warn');
      playSound('error');
    }
  };'''
          if old_end not in text: raise SystemExit('POS checkout end marker not found')
          text = text.replace(old_end, new_end, 1)
          pos.write_text(text)

          domain = Path('src/domain/pos/inventoryResolution.ts')
          text = domain.read_text()
          old = '''    const product = products.find(p => p.id === item.productId);
    if (!product) throw new Error(`Product ${item.productId} could not be resolved for POS inventory`);'''
          new = '''    const product = products.find(p => p.id === item.productId);
    if (!product && /custom\\s*\\/\\s*service/i.test(item.productName)) return null;
    if (!product) throw new Error(`Product ${item.productId} could not be resolved for POS inventory`);'''
          if old not in text: raise SystemExit('domain product-resolution marker not found')
          text = text.replace(old, new, 1)
          text = text.replace('  });\n}\n', '  }).filter((line): line is ResolvedPosInventoryLine => line !== null);\n}\n', 1)
          domain.write_text(text)

          service = Path('src/services/posInventoryService.ts')
          text = service.read_text()
          text = text.replace("  if (!Array.isArray(lines) || lines.length === 0) throw new Error('POS inventory sale requires at least one line');", "  if (!Array.isArray(lines)) throw new Error('POS inventory sale requires inventory sale lines');\n  if (lines.length === 0) return { orderId, actorId: 'non-inventory-sale', lines: [] };")
          service.write_text(text)

          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          if 'tests/pos-inventory-resolution.test.ts' not in data['scripts']['test']:
              data['scripts']['test'] = data['scripts']['test'].replace('tests/inventory-movement.test.ts', 'tests/inventory-movement.test.ts tests/pos-inventory-resolution.test.ts')
          pkg.write_text(json.dumps(data, indent=2) + '\n')

      - name: Validate TypeScript and tests
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/POSModule.tsx src/domain/pos/inventoryResolution.ts src/services/posInventoryService.ts package.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(POS-001-F1): remove legacy POS stock mutation"
          git push origin feat/pos-001-inventory-resolution
